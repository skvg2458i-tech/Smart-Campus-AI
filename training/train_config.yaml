# Training configuration for the custom campus-waste detector (Ultralytics YOLO).
# Classes (order matters, must match annotation export):
#   0 plastic_bottle, 1 paper, 2 wrapper, 3 food_packaging, 4 other_litter
model: yolo11n.pt        # start from COCO-pretrained weights (transfer learning); yolo11s.pt if a GPU is available
epochs: 100
imgsz: 640
batch: 16                # lower to 8 on CPU / low-RAM laptops
patience: 25             # early stopping
optimizer: auto
lr0: 0.01
cos_lr: true
close_mosaic: 10
# augmentation suited to floor-level litter seen from a fixed camera
hsv_h: 0.015
hsv_s: 0.6
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
seed: 42
plots: true
